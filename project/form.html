<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Submit a product review by selecting a product, rating its quality, choosing useful features, and sharing your experience.">
    <meta name="author" content="Davis Ikechukwu Onyenali">

    <title>Product Review</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-group">
                <label for="product">Product Name</label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>
    
        <fieldset class="form-group">
            <legend>Overall Rating</legend>

            <div class="rating">
                <label for="rating1">
                    <span>☆</span>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                </label>

                <label for="rating2">
                    <span>☆☆</span>
                    <input type="radio" id="rating2" name="rating" value="2" required>
                </label>

                <label for="rating3">
                    <span>☆☆☆</span>
                    <input type="radio" id="rating3" name="rating" value="3" required>
                </label>

                <label for="rating4">
                    <span>☆☆☆☆</span>
                    <input type="radio" id="rating4" name="rating" value="4" required>
                </label>

                <label for="rating5">
                    <span>☆☆☆☆☆</span>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </label>
            </div>
        </fieldset>

            <div class="form-group">
                <label for="installation-date">Date of Installation</label>

                <input
                    type="date"
                    id="installation-date"
                    name="installation-date"
                    required
                >
            </div>

            <fieldset class="form-group">
                <legend>
                    Which features did you find useful in the product?
                    <span>(Check all that apply)</span>
                </legend>

                <label for="durability">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability"
                    >
                    Durability
                </label>

                <label for="ease-of-use">
                    <input
                        type="checkbox"
                        id="ease-of-use"
                        name="features"
                        value="Ease of Use"
                    >
                    Ease of Use
                </label>

                <label for="performance">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance"
                    >
                    Performance
                </label>

                <label for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design"
                    >
                    Design
                </label>
            </fieldset>

            <div class="form-group">
                <label for="written-review">
                    Written Review <span>(Optional)</span>
                </label>

                <textarea
                    id="written-review"
                    name="written-review"
                    rows="6"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="user-name">
                    Your Name <span>(Optional)</span>
                </label>

                <input
                    type="text"
                    id="user-name"
                    name="user-name"
                >
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> 🌸 Davis Ikechukwu Onyenali 🌸 Nigeria</p>
        <p>Last Modification: <span id="last-modified"></span></p>
    </footer>

</body>
</html>
